  <script>
    // Suppress benign Vite HMR WebSocket errors in iframe/preview environment
    (function() {
      var origError = console.error;
      console.error = function() {
        var str = arguments && arguments[0] ? String(arguments[0]) : '';
        if (str.includes('[vite]') || str.includes('WebSocket') || str.includes('@vite/client')) {
          return;
        }
        origError.apply(console, arguments);
      };

      if (typeof window !== 'undefined' && window.WebSocket) {
        var RealWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          var isVite = (protocols === 'vite-hmr') || 
                       (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                       (typeof url === 'string' && (url.includes('/@vite/client') || url.includes('token=')));
          if (isVite) {
            var listeners = {};
            var fakeSocket = {
              readyState: 1, // WebSocket.OPEN
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function() { try { fn(new Event('open')); } catch(e) {} }, 10);
                }
              },
              removeEventListener: function(type, fn) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                }
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
            setTimeout(function() {
              if (typeof fakeSocket.onopen === 'function') {
                try { fakeSocket.onopen(new Event('open')); } catch(e) {}
              }
            }, 10);
            return fakeSocket;
          }
          return new RealWebSocket(url, protocols);
        };
        window.WebSocket.prototype = RealWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      }

      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('[vite]'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('[vite]'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    })();
  </script>
